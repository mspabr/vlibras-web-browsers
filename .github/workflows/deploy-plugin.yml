name: Deploy Plugin to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: vlibras-web-browsers

      - name: Checkout Player (Dependência Local)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vlibras-player-webjs
          ref: dev
          path: vlibras-player-webjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          # 1. Resolve as dependências que o Player precisa (necessário para o build do plugin)
          cd vlibras-player-webjs
          npm install --legacy-peer-deps
          
          # 2. Volta e instala as do Plugin
          cd ../vlibras-web-browsers
          npm install --legacy-peer-deps
          
          # 3. Agora o build não vai reclamar de 'superagent' ou 'url-join' ausentes
          npm run build

      - name: Prepare Assets for GH Pages
        run: |
          # Garante o .nojekyll na pasta de saída do plugin
          touch vlibras-web-browsers/widget/app/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: vlibras-web-browsers/widget/app
          branch: gh-pages
          clean: true