name: Deploy Plugin to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        # Removido o 'path' para ele ficar na raiz absoluta (.)

      - name: Checkout Player (Dependência Local)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vlibras-player-webjs
          ref: dev
          path: vlibras-player-webjs # Mantemos o nome da pasta lateral para o build achar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          # 1. Instala as dependências do Player (necessário para que o código fonte seja válido)
          cd vlibras-player-webjs
          npm install --legacy-peer-deps
          
          # 2. Volta para a raiz (Plugin)
          cd ..
          
          # 3. Instala as dependências do Plugin. 
          # O npm vai ler o "file:../vlibras-player-webjs" e criar o link automaticamente
          npm install --legacy-peer-deps
          
          # 4. Executa o build agora que o caminho 'vlibras' existe
          npm run build

      - name: Prepare Assets for GH Pages
        run: |
          # O caminho agora é direto, pois o plugin está na raiz
          touch widget/app/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Sem o 'workspace' problemático
          folder: widget/app
          branch: gh-pages
          clean: true