name: Deploy Plugin to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        # Fica na raiz (.) para o deploy achar o .git de primeira

      - name: Checkout Player (Dependência)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vlibras-player-webjs
          ref: dev
          # Aqui está o truque: baixar o player "fora" da pasta do plugin
          path: ../vlibras-player-webjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          # 1. Buildar o Player onde ele foi baixado (um nível acima)
          cd ../vlibras-player-webjs
          npm install --legacy-peer-deps
          npm run build
          
          # 2. Voltar para a raiz (Plugin) e buildar
          cd ../vlibras-web-browsers # O GitHub coloca o repo atual nesta pasta
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare Assets
        run: touch widget/app/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: widget/app
          branch: gh-pages
          clean: true