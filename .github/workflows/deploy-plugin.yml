name: Deploy Plugin to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: vlibras-web-browsers

      - name: Checkout Player (Dependência Local)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vlibras-player-webjs
          ref: dev
          path: vlibras-player-webjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          cd vlibras-web-browsers
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare Assets for GH Pages
        run: |
          # 1. Cria o arquivo que desativa o Jekyll (essencial para Unity/Binários)
          touch vlibras-web-browsers/widget/app/.nojekyll
          
          # 2. Garante que a pasta target (se não estiver lá) seja copiada para o build final
          # Se o gulp já coloca ela lá, ignore este passo.
          # cp -r vlibras-player-webjs/target vlibras-web-browsers/widget/app/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: vlibras-web-browsers/widget/app
          branch: gh-pages
          # Garante que arquivos ocultos (como o .nojekyll) não sejam excluídos
          clean: true